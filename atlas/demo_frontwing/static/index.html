<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Atlas PoC 2 — live front-wing design</title>
<style>
  :root{
    --bg:#0d1117; --panel:#151b23; --panel2:#1b232d; --line:#2a3441;
    --ink:#e6edf3; --dim:#8b98a5; --dim2:#5f6b78;
    --green:#3fb950; --amber:#d29922; --red:#f85149; --blue:#58a6ff;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
       font:13px/1.5 ui-sans-serif,system-ui,"Segoe UI",Roboto,sans-serif}
  a{color:var(--blue)}
  header{padding:10px 16px;border-bottom:1px solid var(--line);
         display:flex;gap:16px;align-items:baseline;flex-wrap:wrap}
  header h1{font-size:15px;margin:0;font-weight:650}
  header .sub{color:var(--dim);font-size:12px}
  main{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:14px;
       padding:14px;align-items:start}
  @media (max-width:1100px){main{grid-template-columns:minmax(0,1fr)}}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:8px;
        padding:12px}
  .card h2{font-size:12px;margin:0 0 8px;color:var(--dim);font-weight:600;
           text-transform:uppercase;letter-spacing:.06em}
  #stage{position:relative;width:100%;background:#05070a;border-radius:6px;
         overflow:hidden}
  #stage canvas{display:block;width:100%;height:auto}
  .readout{display:grid;grid-template-columns:repeat(auto-fit,minmax(112px,1fr));
           gap:8px;margin-top:10px}
  .stat{background:var(--panel2);border:1px solid var(--line);border-radius:6px;
        padding:8px 10px}
  .stat .k{color:var(--dim);font-size:11px}
  .stat .v{font-size:17px;font-variant-numeric:tabular-nums;margin-top:2px}
  .stat .u{color:var(--dim2);font-size:11px}
  .stat.warn{border-color:var(--amber)} .stat.bad{border-color:var(--red)}
  .bar{height:4px;background:#0b0f14;border-radius:2px;margin-top:6px;
       overflow:hidden}
  .bar i{display:block;height:100%;background:var(--green)}
  .bar i.warn{background:var(--amber)} .bar i.bad{background:var(--red)}
  .knob{margin:10px 0}
  .knob label{display:flex;justify-content:space-between;color:var(--dim);
              font-size:12px;margin-bottom:3px}
  .knob label b{color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}
  .knob input[type=range]{width:100%}
  .seam{display:flex;gap:8px;align-items:flex-start;padding:7px 0;
        border-top:1px solid var(--line)}
  .seam:first-of-type{border-top:none}
  .dot{width:10px;height:10px;border-radius:50%;flex:0 0 10px;margin-top:4px}
  .dot.green{background:var(--green)} .dot.amber{background:var(--amber)}
  .dot.red{background:var(--red)}
  .seam .n{font-weight:600} .seam .kind{color:var(--dim2);font-size:11px}
  .seam .rules{color:var(--dim);font-size:11px;margin-top:2px;
               font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
  .seam .rules b{color:var(--red);font-weight:600}
  .qty{color:var(--dim);font-size:11px;font-variant-numeric:tabular-nums}
  .btn{background:var(--panel2);border:1px solid var(--line);color:var(--ink);
       border-radius:6px;padding:6px 11px;cursor:pointer;font-size:12px}
  .btn:hover{border-color:var(--blue)}
  .btn.on{background:#1f6feb;border-color:#1f6feb}
  .row{display:flex;gap:7px;flex-wrap:wrap;align-items:center}
  .note{color:var(--dim);font-size:11.5px;margin-top:8px}
  .note b{color:var(--ink)}
  .caveat{border-left:2px solid var(--amber);padding-left:9px;margin-top:9px;
          color:var(--dim);font-size:11.5px}
  code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px;
       color:var(--dim)}
  #notice{color:var(--amber);font-size:12px;min-height:17px}
  .legend{display:flex;gap:3px;align-items:center;margin-top:6px;font-size:11px;
          color:var(--dim)}
  .legend .sw{width:74px;height:8px;border-radius:2px}
  table{width:100%;border-collapse:collapse;font-size:11.5px}
  td{padding:2px 0;color:var(--dim)} td.v{text-align:right;color:var(--ink);
     font-variant-numeric:tabular-nums}
  details summary{cursor:pointer;color:var(--dim);font-size:11.5px}
</style>
</head>
<body>
<header>
  <h1>Atlas PoC 2 — front wing</h1>
  <span class="sub">CS-10's ground effect and CS-12's FSI, one graph, both seams
    live · <span id="hdr"></span></span>
</header>

<main>
  <div>
    <div class="card">
      <h2>flow, structure and ride height</h2>
      <div id="stage"><canvas id="cv"></canvas></div>
      <div class="legend">
        <span>speed</span><span class="sw" id="ramp"></span>
        <span id="rampTxt"></span>
        <span style="margin-left:14px">von Mises</span>
        <span class="sw" id="sramp"></span>
        <span id="srampTxt"></span>
      </div>
      <div class="readout" id="readout"></div>
      <div id="notice"></div>
    </div>

    <div class="card" style="margin-top:14px">
      <h2>history</h2>
      <canvas id="hist" height="150" style="width:100%"></canvas>
      <div class="note" id="histNote"></div>
    </div>
  </div>

  <div>
    <div class="card">
      <h2>per-seam certification</h2>
      <div id="seams"></div>
      <div class="note" id="certNote"></div>
      <div class="caveat" id="certCaveat"></div>
    </div>

    <div class="card" style="margin-top:14px">
      <h2>design</h2>
      <div id="knobs"></div>
      <div class="row" style="margin-top:10px">
        <button class="btn" id="bRun">run</button>
        <button class="btn" id="bOpt">optimise</button>
        <button class="btn" id="bStep">step</button>
        <button class="btn" id="bPause">pause</button>
        <button class="btn" id="bReset">reset</button>
      </div>
      <div class="note" id="optNote"></div>
    </div>

    <div class="card" style="margin-top:14px">
      <h2>scheme</h2>
      <div class="row">
        <span class="qty">tiling</span>
        <button class="btn" data-cfg="tiling" data-val="six">six windows</button>
        <button class="btn" data-cfg="tiling" data-val="single">referent</button>
      </div>
      <div class="row" style="margin-top:7px">
        <span class="qty">coupling</span>
        <button class="btn" data-cfg="coupling" data-val="tight">joint</button>
        <button class="btn" data-cfg="coupling" data-val="lagged">lagged</button>
        <button class="btn" data-cfg="coupling" data-val="split">split</button>
      </div>
      <div class="note" id="schemeNote"></div>
    </div>

    <div class="card" style="margin-top:14px">
      <h2>what this is not</h2>
      <div class="note" id="scope"></div>
    </div>
  </div>
</main>

<script>
const $ = s => document.querySelector(s);
let META = null, S = null, IMG = null, dragging = null;

function fmt(x, n=4){ if(x===undefined||x===null||!isFinite(x)) return "—";
  const a=Math.abs(x); if(a!==0&&(a<1e-3||a>=1e5)) return x.toExponential(2);
  return x.toFixed(n); }

/* ---------------- the stage: field + plate + floor ---------------- */
function draw(){
  if(!S) return;
  const cv = $("#cv"), g = cv.getContext("2d");
  const D = S.domain, W = D.nx, H = D.ny;
  const scale = 3;
  cv.width = W*scale; cv.height = H*scale;
  g.imageSmoothingEnabled = false;
  if(IMG) g.drawImage(IMG, 0, 0, cv.width, cv.height);
  else { g.fillStyle="#05070a"; g.fillRect(0,0,cv.width,cv.height); }

  // domain -> canvas.  y is flipped: the array's row 0 is y = 0 and the image's
  // row 0 is the top, and the field PNG is already flipped, so the plate must
  // be flipped the same way or the two pictures disagree.
  const px = x => (x/D.dx)*scale;
  const py = y => cv.height - (y/D.dx)*scale;

  // the rolling road
  g.strokeStyle="#8899aa"; g.lineWidth=2; g.setLineDash([7,5]);
  g.beginPath(); g.moveTo(0,cv.height-1); g.lineTo(cv.width,cv.height-1);
  g.stroke(); g.setLineDash([]);

  const G = S.geometry;
  if(G && G.quads){
    // the ride-height leader, from the floor to the leading edge
    g.strokeStyle="#58a6ff"; g.lineWidth=1.5; g.setLineDash([3,3]);
    g.beginPath();
    g.moveTo(px(G.chord_x[0]), cv.height); g.lineTo(px(G.chord_x[0]), py(G.chord_y[0]));
    g.stroke(); g.setLineDash([]);
    g.fillStyle="#58a6ff"; g.font="11px ui-monospace,monospace";
    g.fillText("h = "+fmt(S.readout.ride_height,4), px(G.chord_x[0])+5,
               (cv.height+py(G.chord_y[0]))/2);

    // the plate, one quad per chordwise station, coloured by von Mises
    for(const q of G.quads){
      g.beginPath();
      g.moveTo(px(q.p[0][0]), py(q.p[0][1]));
      for(let i=1;i<4;i++) g.lineTo(px(q.p[i][0]), py(q.p[i][1]));
      g.closePath();
      g.fillStyle = q.colour; g.fill();
      g.strokeStyle="rgba(0,0,0,.45)"; g.lineWidth=.6; g.stroke();
    }
    // the undeflected chord line, so the bending is visible against something
    g.strokeStyle="rgba(255,255,255,.35)"; g.lineWidth=1; g.setLineDash([4,4]);
    g.beginPath();
    g.moveTo(px(G.chord_x[0]), py(G.chord_y[0]));
    const dx = G.chord_x[1]-G.chord_x[0], dy = G.chord_y[1]-G.chord_y[0];
    const L = Math.hypot(dx,dy);
    g.lineTo(px(G.chord_x[0]+L*Math.cos(20*Math.PI/180)),
             py(G.chord_y[0]+L*Math.sin(20*Math.PI/180)));
    g.stroke(); g.setLineDash([]);
  }
}

/* ---------------- readout ---------------- */
function stat(k, v, u, frac, cls){
  const bar = frac===undefined ? "" :
    `<div class="bar"><i class="${cls||''}" style="width:${Math.max(0,Math.min(100,frac*100))}%"></i></div>`;
  return `<div class="stat ${cls||''}"><div class="k">${k}</div>
          <div class="v">${v}</div><div class="u">${u||""}</div>${bar}</div>`;
}
function readout(){
  const r = S.readout;
  const sfrac = r.vm_max / r.vm_ceiling, dfrac = r.delta_max / r.delta_ceiling;
  const scls = sfrac>1 ? "bad" : sfrac>0.9 ? "warn" : "";
  const dcls = dfrac>1 ? "bad" : dfrac>0.9 ? "warn" : "";
  $("#readout").innerHTML =
    stat("downforce", fmt(r.downforce,5), "per unit span") +
    stat("drag", fmt(r.drag,5), "L/D " + fmt(r.lift_to_drag,2)) +
    stat("ride height", fmt(r.ride_height,5), "h") +
    stat("tip deflection", fmt(r.tip,5), "delta at the trailing edge") +
    stat("max von Mises", fmt(r.vm_max,1),
         "ceiling " + fmt(r.vm_ceiling,0), sfrac, scls) +
    stat("max |delta|", fmt(r.delta_max,5),
         "ceiling " + fmt(r.delta_ceiling,3), dfrac, dcls) +
    stat("interface residual", fmt(r.interface_residual,3),
         "33-equation Newton, 3 fixed steps") +
    stat("step", S.step_ms===null?"—":fmt(S.step_ms,0)+" ms",
         S.mode==="optimize" ? "one adjoint" : "one macro-step");
  $("#notice").textContent = S.notice || "";
}

/* ---------------- the certification panel ---------------- */
function seams(){
  const c = S.certification || {};
  const box = $("#seams");
  if(c.state !== "ok"){
    box.innerHTML = `<div class="qty">${c.state==="running"
      ? "compiling…" : (c.error||"waiting for the first compile")}</div>`;
    return;
  }
  const q = S.seam_quantities || {};
  const order = Object.keys(c.seams).sort((a,b)=>{
    const w = s => s==="wet"?0 : s==="mount"?1 : 2;
    return w(a)-w(b) || a.localeCompare(b);
  });
  box.innerHTML = order.map(id=>{
    const s = c.seams[id];
    const ref = s.refusals.map(r=>`<b>${r}</b>`).join(" ");
    const dec = s.decertifications.join(" ");
    const gl  = s.global_decertifications.length;
    const qq = q[id] ? `<div class="qty">${q[id].label}: ${fmt(q[id].value,4)}</div>` : "";
    return `<div class="seam"><span class="dot ${s.colour}"></span><div>
      <div><span class="n">${id}</span>
        <span class="kind">· ${s.kind} · ${s.a} ↔ ${s.b}</span></div>
      <div class="rules">${ref}${ref&&dec?" ":""}${dec}${
        (ref||dec)?" ":""}${gl?`+${gl} graph-level`:""}</div>
      ${qq}</div></div>`;
  }).join("");

  const worst = order.map(i=>c.seams[i].colour);
  $("#certNote").innerHTML =
    `graph verdict <b>${c.verdict}</b> · every colour is `+
    `<code>compile_scheme</code>'s own decision, grouped by the seam its `+
    `<code>subject</code> reaches. Green needs zero refusals AND zero `+
    `decertifications; ${c.unmeasured&&c.unmeasured.length?
      `<b>${c.unmeasured.length}</b> constants are unmeasured (W1, W3, W49), `+
      `which has forced <code>admit-uncertified</code> on every graph in this `+
      `package since W56 — so nothing here can be green.`:""}`;
  $("#certCaveat").innerHTML =
    `<b>The colour is a property of the declaration, not of the design point.</b>
     Over the sixteen corners of the design box, zero produce a different
     per-seam verdict map — so these lights change when the interface is
     <i>declared</i> to move (the two surface seams go red at
     <code>L2/InterfaceMotion</code>; the seven fluid–fluid ones stay amber) and
     they do not flicker as a knob turns. The compile is still re-run on every
     design change, on its own thread, because the honest way to show that is to
     run it${c.wall_s?` (${fmt(c.wall_s,1)} s)`:""}. What moves with the design is
     the quantity under each light.`;
}

/* ---------------- knobs ---------------- */
function knobs(){
  if($("#knobs").dataset.built) { syncKnobs(); return; }
  $("#knobs").dataset.built = "1";
  $("#knobs").innerHTML = META.keys.map(k=>{
    const [lo,hi] = META.box[k];
    return `<div class="knob"><label><span>${META.labels[k]}</span>
      <b id="v_${k}"></b></label>
      <input type="range" id="s_${k}" min="${lo}" max="${hi}"
             step="${(hi-lo)/500}"></div>`;
  }).join("");
  for(const k of META.keys){
    const el = $("#s_"+k);
    el.addEventListener("input", ()=>{
      dragging = k;
      $("#v_"+k).textContent = fmt(+el.value, k==="e_star"?0:4);
      send({type:"design", design:{[k]:+el.value}});
    });
    el.addEventListener("change", ()=>{ dragging = null; });
  }
}
function syncKnobs(){
  for(const k of META.keys){
    if(dragging===k) continue;
    $("#s_"+k).value = S.design[k];
    $("#v_"+k).textContent = fmt(S.design[k], k==="e_star"?0:4);
  }
}

/* ---------------- history ---------------- */
function hist(){
  const cv = $("#hist"), g = cv.getContext("2d");
  const w = cv.width = cv.clientWidth, h = cv.height;
  g.clearRect(0,0,w,h);
  const t = S.trace || [];
  if(t.length < 2){ return; }
  const series = [
    {k:"load", c:"#3fb950", lbl:"downforce"},
    {k:"vm",   c:"#d29922", lbl:"max von Mises", scale:1/S.readout.vm_ceiling},
    {k:"h",    c:"#58a6ff", lbl:"ride height"},
  ];
  for(const s of series){
    const ys = t.map(p=> s.scale ? p[s.k]*s.scale : p[s.k]);
    const lo = Math.min(...ys), hi = Math.max(...ys);
    const pad = (hi-lo)*0.15 || 1e-6;
    g.strokeStyle = s.c; g.lineWidth = 1.4; g.beginPath();
    ys.forEach((y,i)=>{
      const X = i/(ys.length-1)*w;
      const Y = h - (y-lo+pad)/((hi-lo)+2*pad)*h;
      i? g.lineTo(X,Y): g.moveTo(X,Y);
    });
    g.stroke();
  }
  // the stress ceiling, on the von Mises trace's own scale
  $("#histNote").innerHTML = series.map(s=>
    `<span style="color:${s.c}">■</span> ${s.lbl}`).join(" &nbsp; ") +
    ` &nbsp;·&nbsp; each trace is auto-scaled to its own range, so read the
      SHAPE here and the VALUE in the readout above`;
}

/* ---------------- ramps ---------------- */
function ramps(){
  const mk = (el, stops, lo, hi, txt) => {
    const c = document.createElement("canvas");
    c.width = 74; c.height = 8;
    const g = c.getContext("2d");
    const grd = g.createLinearGradient(0,0,74,0);
    for(const [a,rgb] of stops) grd.addColorStop(a, `rgb(${rgb.join(",")})`);
    g.fillStyle = grd; g.fillRect(0,0,74,8);
    el.style.background = `url(${c.toDataURL()})`;
    el.style.backgroundSize = "cover";
    txt.textContent = `${lo} – ${hi}`;
  };
  mk($("#ramp"), S.ramp.stops, S.ramp.lo, S.ramp.hi, $("#rampTxt"));
  mk($("#sramp"), S.ramp.stress, 0, fmt(S.readout.vm_ceiling,0), $("#srampTxt"));
}

/* ---------------- wiring ---------------- */
let ws = null;
function send(m){ if(ws && ws.readyState===1) ws.send(JSON.stringify(m)); }

function apply(state){
  S = state;
  if(!$("#knobs").dataset.built) knobs(); else syncKnobs();
  readout(); seams(); hist(); draw();
  if(!$("#ramp").style.background) ramps();
  $("#hdr").textContent =
    `${S.config.tiling==="single"?"referent (one window)":"six windows"} · `+
    `${S.config.coupling} coupling · step ${S.iteration} · `+
    (S.eta_s===null?"timing…":`${fmt(S.eta_s,2)} s/step (measured here)`);
  for(const b of document.querySelectorAll("[data-cfg]"))
    b.classList.toggle("on", S.config[b.dataset.cfg] === b.dataset.val);
  for(const [id,m] of [["bRun","run"],["bOpt","optimize"],["bStep","step"],
                       ["bPause","paused"]])
    $("#"+id).classList.toggle("on", S.mode===m);
  $("#optNote").innerHTML =
    `The optimiser's rollout <b>is</b> the live march — warm-started and
     ${S.config.horizon} macro-steps long — so the field animates inside the
     gradient step. <b>That is a different estimator</b> from the results page's
     ${'120'}-macro-step rollout from a settled field, and its number is a demo
     number. Constraints enter as a smooth exterior penalty at weight
     ${fmt(S.config.penalty,0)}, on margins normalised by their own ceiling.`;
  $("#schemeNote").innerHTML =
    `<b>joint</b> solves both seams as one 33-equation system;
     <b>split</b> solves them in turn, which is the ablation;
     <b>lagged</b> holds the answer for ${S.config.lag} macro-step(s).
     <b>referent</b> is the same code path at one window — it differs from six
     windows by the cut and by nothing else.`;
}

function connect(){
  ws = new WebSocket((location.protocol==="https:"?"wss":"ws")+"://"+
                     location.host+"/ws");
  ws.binaryType = "blob";
  ws.onmessage = ev => {
    if(typeof ev.data === "string"){ apply(JSON.parse(ev.data)); return; }
    const url = URL.createObjectURL(ev.data);
    const im = new Image();
    im.onload = ()=>{ if(IMG&&IMG.src) URL.revokeObjectURL(IMG.src);
                      IMG = im; draw(); };
    im.src = url;
  };
  ws.onclose = ()=> setTimeout(connect, 1200);
}

(async ()=>{
  META = await (await fetch("/api/meta")).json();
  $("#scope").innerHTML =
    `<b>The structure.</b> ${META.scope.structure}
     <div style="margin-top:7px"><b>The thickness.</b> ${META.scope.thickness}</div>
     <div style="margin-top:7px"><b>R10 in the assembly.</b> ${META.scope.r10}</div>`;
  for(const [id,m] of [["bRun","run"],["bOpt","optimize"],["bStep","step"],
                       ["bPause","paused"]])
    $("#"+id).onclick = ()=> send({type:"mode", mode:m});
  $("#bReset").onclick = ()=> send({type:"reset"});
  for(const b of document.querySelectorAll("[data-cfg]"))
    b.onclick = ()=> send({type:"config",
                           config:{[b.dataset.cfg]: b.dataset.val}});
  connect();
})();
</script>
</body>
</html>
