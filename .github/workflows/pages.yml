# Publishes the proposal website (the folder site/) to GitHub Pages.
# Runs on every push to atlas-0.1 that changes site/, and by hand from the Actions tab.
# Settings -> Pages -> Source must be "GitHub Actions".
name: Website

on:
  push:
    branches: [atlas-0.1]
    paths: ["site/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
